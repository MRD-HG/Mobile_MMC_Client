// Plugin versions are declared once, in settings.gradle (pluginManagement).
// The legacy buildscript block (AGP 4.2.2 / Kotlin 1.7.10) was removed: it
// conflicted with the plugins DSL and is incompatible with Gradle 8.
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
