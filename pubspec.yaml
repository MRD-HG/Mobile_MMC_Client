name: client_mobile
description: "Morocco Microsoft Community (MMC) mobile app — events, programs and speakers."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: '>=3.5.0 <4.0.0' # Flutter 3.24+

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Version is pinned by flutter_localizations; `any` avoids solver conflicts
  # across Flutter releases.
  intl: any
  http: ^1.2.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/brand/
    - assets/images/events/
    - assets/images/speakers/
    - assets/images/gallery/
